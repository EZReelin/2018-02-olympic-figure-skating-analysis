        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #F5F7FA;
            color: #212121;
            font-size: 16px;
            line-height: 1.5;
            padding-bottom: 80px; /* Space for bottom nav */
            overflow-x: hidden;
        }

        /* ==================== HEADER & PROGRESS ==================== */
        .header {
            background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%);
            color: white;
            padding: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .header-content {
            max-width: 800px;
            margin: 0 auto;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .header .date {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 12px;
        }

        .progress-container {
            background: rgba(255,255,255,0.2);
            border-radius: 12px;
            height: 24px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            background: linear-gradient(90deg, #4CAF50 0%, #66BB6A 100%);
            height: 100%;
            transition: width 0.4s ease-out;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            color: white;
            min-width: 50px;
        }

        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 14px;
            font-weight: 600;
            color: white;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
            z-index: 1;
        }

        /* ==================== MAIN CONTAINER ==================== */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        /* ==================== TIME BLOCKS ==================== */
        .time-block {
            background: white;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .time-block.current {
            box-shadow: 0 4px 16px rgba(255, 152, 0, 0.3);
            border: 2px solid #FF9800;
        }

        .block-header {
            background: #E3F2FD;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .time-block.current .block-header {
            background: linear-gradient(135deg, #FF9800 0%, #F57C00 100%);
            color: white;
        }

        .block-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .block-icon {
            font-size: 28px;
            line-height: 1;
        }

        .block-title {
            font-size: 20px;
            font-weight: 700;
        }

        .block-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 2px;
        }

        .block-progress {
            font-size: 16px;
            font-weight: 600;
            padding: 6px 12px;
            background: rgba(255,255,255,0.9);
            border-radius: 20px;
            color: #2196F3;
        }

        .time-block.current .block-progress {
            background: rgba(255,255,255,0.95);
            color: #F57C00;
        }

        .block-content {
            padding: 0;
        }

        /* ==================== TASKS ==================== */
        .task-list {
            list-style: none;
        }

        .task-item {
            padding: 16px 20px;
            border-bottom: 1px solid #F0F0F0;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: background 0.2s ease;
        }

        .task-item:last-child {
            border-bottom: none;
        }

        .task-item:active {
            background: #FAFAFA;
        }

        .task-checkbox {
            min-width: 48px;
            min-height: 48px;
            width: 48px;
            height: 48px;
            border: 3px solid #E0E0E0;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            flex-shrink: 0;
        }

        .task-checkbox:hover {
            border-color: #2196F3;
            transform: scale(1.05);
        }

        .task-checkbox.completed {
            background: #4CAF50;
            border-color: #4CAF50;
            animation: checkboxComplete 0.3s ease;
        }

        @keyframes checkboxComplete {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        .task-info {
            flex: 1;
        }

        .task-time {
            font-size: 14px;
            font-weight: 600;
            color: #2196F3;
            margin-bottom: 4px;
        }

        .task-name {
            font-size: 16px;
            color: #212121;
            font-weight: 500;
        }

        .task-item.completed .task-name {
            opacity: 0.6;
        }

        .task-icon {
            font-size: 24px;
        }

        /* ==================== GYM EXERCISES ==================== */
        .exercise-list {
            list-style: none;
        }

        .exercise-item {
            padding: 12px 20px;
            border-bottom: 1px solid #F0F0F0;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .exercise-item:last-child {
            border-bottom: none;
        }

        .exercise-checkbox {
            min-width: 36px;
            min-height: 36px;
            width: 36px;
            height: 36px;
            border: 2px solid #E0E0E0;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.2s ease;
        }

        .exercise-checkbox.completed {
            background: #4CAF50;
            border-color: #4CAF50;
        }

        .exercise-info {
            flex: 1;
        }

        .exercise-name {
            font-size: 16px;
            font-weight: 500;
        }

        .exercise-details {
            font-size: 14px;
            color: #666;
            margin-top: 2px;
        }

        /* ==================== DARTS PRACTICE ==================== */
        .darts-theme {
            background: linear-gradient(135deg, #E3F2FD 0%, #BBDEFB 100%);
            padding: 16px 20px;
            margin-bottom: 0;
            border-bottom: 1px solid #90CAF9;
        }

        .theme-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #1976D2;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .theme-text {
            font-size: 18px;
            font-weight: 700;
            color: #1565C0;
        }

        /* ==================== BOTTOM NAVIGATION ==================== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 1px solid #E0E0E0;
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            z-index: 99;
            box-shadow: 0 -2px 8px rgba(0,0,0,0.08);
        }

        .nav-button {
            flex: 1;
            background: none;
            border: none;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            color: #757575;
            font-size: 12px;
            transition: all 0.2s ease;
            min-height: 64px;
        }

        .nav-button:active {
            background: #F5F5F5;
        }

        .nav-button .nav-icon {
            font-size: 24px;
        }

        .nav-button.active {
            color: #2196F3;
        }

        /* ==================== RESET BUTTON ==================== */
        .reset-container {
            text-align: center;
            padding: 40px 20px;
            margin-top: 20px;
        }

        .reset-button {
            background: #F44336;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .reset-button:active {
            transform: scale(0.95);
            background: #D32F2F;
        }

        /* ==================== CONFETTI CELEBRATION ==================== */
        .confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }

        /* ==================== STREAK COUNTER ==================== */
        .streak-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.25);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin-top: 8px;
        }

        .streak-badge .streak-icon {
            font-size: 16px;
        }

        /* ==================== CURRENT TIME INDICATOR ==================== */
        .current-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.95);
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 600;
            color: #FF9800;
            margin-left: 8px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background: #FF9800;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        .weekend-message {
            background: linear-gradient(135deg, #E8F5E9 0%, #C8E6C9 100%);
            padding: 24px;
            border-radius: 16px;
            text-align: center;
            margin: 20px 0;
        }

        .weekend-message h2 {
            font-size: 24px;
            color: #2E7D32;
            margin-bottom: 8px;
        }

        .weekend-message p {
            font-size: 16px;
            color: #388E3C;
        }

        /* ==================== RESPONSIVE ADJUSTMENTS ==================== */

            .header h1 {
                font-size: 20px;
            }

            .block-title {
                font-size: 18px;
            }

            .task-name {
                font-size: 15px;
            }

            .container {
                padding: 12px;
            }
        }

        /* ==================== UTILITY CLASSES ==================== */
        .hidden {
            display: none !important;
        }

        .fade-in {
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

        // ==================== STATE MANAGEMENT ====================
        let completionState = {};
        let currentDay = '';

        // ==================== INITIALIZATION ====================
        function init() {
            checkAndResetIfNewDay();
            loadState();
            updateUI();
            updateDateTime();
            setInterval(updateDateTime, 60000); // Update every minute
            setInterval(highlightCurrentBlock, 60000); // Check current block every minute
            scrollToCurrentBlock();
        }

        // ==================== DATE & TIME MANAGEMENT ====================
        function updateDateTime() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('currentDate').textContent = now.toLocaleDateString('en-US', options);
        }

        function getDayKey() {
            const days = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
            return days[new Date().getDay()];
        }

        function checkAndResetIfNewDay() {
            const today = new Date().toDateString();
            const lastDate = localStorage.getItem('lastDate');

            if (lastDate !== today) {
                // New day - reset everything
                localStorage.setItem('lastDate', today);
                localStorage.removeItem('completionState');
                completionState = {};

                // Update streak
                updateStreak();
            }
        }

        // ==================== STREAK MANAGEMENT ====================
        function updateStreak() {
            const yesterday = new Date();
            yesterday.setDate(yesterday.getDate() - 1);
            const yesterdayKey = yesterday.toDateString();

            const yesterdayCompletion = localStorage.getItem(`completion_${yesterdayKey}`);
            const currentStreak = parseInt(localStorage.getItem('currentStreak') || '0');

            if (yesterdayCompletion && parseFloat(yesterdayCompletion) >= 80) {
                // Yesterday was completed, continue streak
                const streakCount = document.getElementById('streakCount');
                streakCount.textContent = `${currentStreak} day streak`;
            } else if (currentStreak > 0 && !yesterdayCompletion) {
                // Streak broken
                localStorage.setItem('currentStreak', '0');
                document.getElementById('streakCount').textContent = '0 day streak';
            }
        }

        // ==================== STATE PERSISTENCE ====================
        function loadState() {
            const saved = localStorage.getItem('completionState');
            completionState = saved ? JSON.parse(saved) : {};
            currentDay = getDayKey();
        }

        function saveState() {
            localStorage.setItem('completionState', JSON.stringify(completionState));

            // Save completion percentage for streak tracking
            const progress = calculateProgress();
            const today = new Date().toDateString();
            localStorage.setItem(`completion_${today}`, progress.toString());

            // Update streak if day is complete
            if (progress >= 80) {
                const currentStreak = parseInt(localStorage.getItem('currentStreak') || '0');
                const newStreak = currentStreak + 1;
                localStorage.setItem('currentStreak', newStreak.toString());
                document.getElementById('streakCount').textContent = `${newStreak} day streak`;

                // Celebrate!
                if (progress === 100) {
                    triggerConfetti();
                }
            }
        }

        // ==================== PROGRESS CALCULATION ====================
        function calculateProgress() {
            const dayData = routineData[currentDay];
            if (!dayData) return 0;

            let total = 0;
            let completed = 0;

            // Count all tasks and exercises
            Object.keys(dayData).forEach(blockKey => {
                const block = dayData[blockKey];

                if (block.tasks) {
                    total += block.tasks.length;
                    block.tasks.forEach(task => {
                        if (completionState[task.id]) completed++;
                    });
                }

                if (block.exercises) {
                    total += block.exercises.length;
                    block.exercises.forEach(exercise => {
                        if (completionState[exercise.id]) completed++;
                    });
                }

                if (block.structure) {
                    total += block.structure.length;
                    block.structure.forEach(item => {
                        if (completionState[item.id]) completed++;
                    });
                }
            });

            return total > 0 ? Math.round((completed / total) * 100) : 0;
        }

        function updateProgress() {
            const progress = calculateProgress();
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');

            progressBar.style.width = progress + '%';
            progressText.textContent = progress + '%';

            saveState();
        }

        // ==================== UI RENDERING ====================
        function updateUI() {
            const container = document.getElementById('mainContainer');
            const dayData = routineData[currentDay];

            if (!dayData) {
                container.innerHTML = '<div class="weekend-message"><h2>No routine found</h2></div>';
                return;
            }

            container.innerHTML = '';

            // Render each time block
            Object.keys(dayData).forEach(blockKey => {
                const block = dayData[blockKey];
                const blockEl = createTimeBlock(blockKey, block);
                container.appendChild(blockEl);
            });

            updateProgress();
            highlightCurrentBlock();
        }

        function createTimeBlock(blockKey, block) {
            const blockDiv = document.createElement('div');
            blockDiv.className = 'time-block';
            blockDiv.id = `block-${blockKey}`;

            // Calculate block progress
            let blockTotal = 0;
            let blockCompleted = 0;

            if (block.tasks) {
                blockTotal += block.tasks.length;
                block.tasks.forEach(task => {
                    if (completionState[task.id]) blockCompleted++;
                });
            }
            if (block.exercises) {
                blockTotal += block.exercises.length;
                block.exercises.forEach(ex => {
                    if (completionState[ex.id]) blockCompleted++;
                });
            }
            if (block.structure) {
                blockTotal += block.structure.length;
                block.structure.forEach(item => {
                    if (completionState[item.id]) blockCompleted++;
                });
            }

            const progressText = `${blockCompleted}/${blockTotal}`;

            // Header
            const header = document.createElement('div');
            header.className = 'block-header';
            header.innerHTML = `
                <div class="block-header-left">
                    <div class="block-icon">${block.icon}</div>
                    <div>
                        <div class="block-title">${block.title}</div>
                        <div class="block-time">${block.time}</div>
                    </div>
                </div>
                <div class="block-progress">${progressText}</div>
            `;

            blockDiv.appendChild(header);

            // Content
            const content = document.createElement('div');
            content.className = 'block-content';

            // Darts theme if present
            if (block.theme) {
                const themeDiv = document.createElement('div');
                themeDiv.className = 'darts-theme';
                themeDiv.innerHTML = `
                    <div class="theme-label">Today's Focus</div>
                    <div class="theme-text">${block.theme}</div>
                `;
                content.appendChild(themeDiv);
            }

            // Tasks
            if (block.tasks) {
                const taskList = document.createElement('ul');
                taskList.className = 'task-list';

                block.tasks.forEach(task => {
                    const li = createTaskItem(task);
                    taskList.appendChild(li);
                });

                content.appendChild(taskList);
            }

            // Exercises
            if (block.exercises) {
                const exerciseList = document.createElement('ul');
                exerciseList.className = 'exercise-list';

                block.exercises.forEach(exercise => {
                    const li = createExerciseItem(exercise);
                    exerciseList.appendChild(li);
                });

                content.appendChild(exerciseList);
            }

            // Darts structure
            if (block.structure) {
                const structureList = document.createElement('ul');
                structureList.className = 'task-list';

                block.structure.forEach(item => {
                    const li = createTaskItem(item);
                    structureList.appendChild(li);
                });

                content.appendChild(structureList);
            }

            blockDiv.appendChild(content);
            return blockDiv;
        }

        function createTaskItem(task) {
            const li = document.createElement('li');
            li.className = 'task-item';
            if (completionState[task.id]) li.classList.add('completed');

            const checkbox = document.createElement('div');
            checkbox.className = 'task-checkbox';
            if (completionState[task.id]) {
                checkbox.classList.add('completed');
                checkbox.textContent = '✓';
            }
            checkbox.onclick = () => toggleTask(task.id);

            const info = document.createElement('div');
            info.className = 'task-info';
            info.innerHTML = `
                ${task.time ? `<div class="task-time">${task.time}</div>` : ''}
                <div class="task-name">${task.task}</div>
            `;

            const icon = document.createElement('div');
            icon.className = 'task-icon';
            icon.textContent = task.icon;

            li.appendChild(checkbox);
            li.appendChild(info);
            li.appendChild(icon);

            return li;
        }

        function createExerciseItem(exercise) {
            const li = document.createElement('li');
            li.className = 'exercise-item';
            if (completionState[exercise.id]) li.classList.add('completed');

            const checkbox = document.createElement('div');
            checkbox.className = 'exercise-checkbox';
            if (completionState[exercise.id]) {
                checkbox.classList.add('completed');
                checkbox.textContent = '✓';
            }
            checkbox.onclick = () => toggleTask(exercise.id);

            const info = document.createElement('div');
            info.className = 'exercise-info';
            info.innerHTML = `
                <div class="exercise-name">${exercise.name}</div>
                <div class="exercise-details">${exercise.sets}${exercise.rest ? ` • Rest: ${exercise.rest}` : ''}</div>
            `;

            li.appendChild(checkbox);
            li.appendChild(info);

            return li;
        }

        // ==================== TASK COMPLETION ====================
        function toggleTask(taskId) {
            completionState[taskId] = !completionState[taskId];
            updateUI();
        }

        // ==================== TIME-AWARE FEATURES ====================
        function getCurrentTimeBlock() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const totalMinutes = hours * 60 + minutes;

            // Define time ranges (in minutes from midnight)
            const ranges = {
                morning: { start: 5 * 60, end: 6 * 60 + 45 },      // 5:00am - 6:45am
                workday: { start: 6 * 60 + 45, end: 16 * 60 },     // 6:45am - 4:00pm
                gym: { start: 16 * 60, end: 16 * 60 + 50 },        // 4:00pm - 4:50pm
                darts: { start: 17 * 60 + 15, end: 19 * 60 + 15 }, // 5:15pm - 7:15pm
                recovery: { start: 19 * 60 + 15, end: 22 * 60 }    // 7:15pm - 10:00pm
            };

            for (let [block, range] of Object.entries(ranges)) {
                if (totalMinutes >= range.start && totalMinutes < range.end) {
                    return block;
                }
            }

            return null;
        }

        function highlightCurrentBlock() {
            const currentBlock = getCurrentTimeBlock();

            // Remove all current highlights
            document.querySelectorAll('.time-block.current').forEach(el => {
                el.classList.remove('current');
            });

            // Add highlight to current block
            if (currentBlock) {
                const blockEl = document.getElementById(`block-${currentBlock}`);
                if (blockEl) {
                    blockEl.classList.add('current');
                }
            }
        }

        function scrollToCurrentBlock() {
            const currentBlock = getCurrentTimeBlock();
            if (currentBlock) {
                setTimeout(() => {
                    const blockEl = document.getElementById(`block-${currentBlock}`);
                    if (blockEl) {
                        blockEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                }, 100);
            }
        }

        // ==================== NAVIGATION ====================
        function scrollToSection(section) {
            const blockEl = document.getElementById(`block-${section}`);
            if (blockEl) {
                blockEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        // ==================== RESET FUNCTIONALITY ====================
        function resetDay() {
            if (confirm('Are you sure you want to reset today? All progress will be lost.')) {
                completionState = {};
                saveState();
                updateUI();
            }
        }

        // ==================== CONFETTI CELEBRATION ====================
        function triggerConfetti() {
            const canvas = document.getElementById('confettiCanvas');
            const ctx = canvas.getContext('2d');

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const confetti = [];
            const colors = ['#4CAF50', '#2196F3', '#FF9800', '#E91E63', '#9C27B0'];

            // Create confetti pieces
            for (let i = 0; i < 150; i++) {
                confetti.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    size: Math.random() * 8 + 4,
                    speed: Math.random() * 3 + 2,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rotation: Math.random() * 360,
                    rotationSpeed: Math.random() * 10 - 5
                });
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                confetti.forEach((piece, index) => {
                    ctx.save();
                    ctx.translate(piece.x, piece.y);
                    ctx.rotate(piece.rotation * Math.PI / 180);
                    ctx.fillStyle = piece.color;
                    ctx.fillRect(-piece.size / 2, -piece.size / 2, piece.size, piece.size);
                    ctx.restore();

                    piece.y += piece.speed;
                    piece.rotation += piece.rotationSpeed;

                    if (piece.y > canvas.height) {
                        confetti.splice(index, 1);
                    }
                });

                if (confetti.length > 0) {
                    requestAnimationFrame(animate);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }

            animate();
        }

        // ==================== START APPLICATION ====================
        window.onload = init;
